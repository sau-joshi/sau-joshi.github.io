---
layout: default
---

<article class="blog-post">

  <p class="blog-date">
    {{ page.date | date: "%B %-d, %Y" }}
  </p>

  <h1>{{ page.title }}</h1>

  {% if page.description %}
    <p class="blog-description">
      {{ page.description }}
    </p>
  {% endif %}

  <div class="blog-content">
    {{ content }}
  </div>

</article>
